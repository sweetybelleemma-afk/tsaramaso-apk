<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tsaramaso IA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1424">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tsaramaso IA">
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151e2e;
      --border: #1f2937;
      --text: #e2e8f0;
      --muted: #64748b;
      --blue: #3b82f6;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
      --purple: #a855f7;
      --pink: #ec4899;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── LAYOUT PRINCIPAL : colonne flex 100vh ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* dynamic viewport height — tient compte de la barre browser */
    }

    /* ── HEADER fixe ── */
    .app-header {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      height: 56px;
      background: #0d1424;
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo { font-size: 22px; }
    .app-title {
      font-size: 17px; font-weight: 800;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .server-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .server-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .server-dot.offline { background: var(--red); }

    /* ── ZONE PAGES (scroll interne) ── */
    .pages {
      flex: 1 1 auto;
      overflow: hidden;
      position: relative;
      min-height: 0; /* crucial pour que flex enfant scroll */
    }
    .page {
      position: absolute; inset: 0;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .page.active { display: flex; }

    /* Page jeux — plein écran, pas de padding */
    #page-jeux { padding: 0; }
    #game-iframe { width: 100%; height: 100%; border: none; display: block; }

    /* ── NAV BAS fixe ── */
    .bottom-nav {
      flex: 0 0 auto;
      display: flex;
      height: 60px;
      background: #0d1424;
      border-top: 1px solid var(--border);
      /* Safe area iOS/Android */
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      cursor: pointer; color: var(--muted);
      font-size: 11px; font-weight: 600;
      border: none; background: none;
      transition: color 0.2s;
      padding: 6px 0;
    }
    .nav-btn .nav-icon { font-size: 20px; line-height: 1; }
    .nav-btn.active { color: var(--blue); }
    .nav-btn.active .nav-icon { filter: drop-shadow(0 0 4px var(--blue)); }

    /* ── CARDS ── */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .card-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; font-weight: 700; }

    /* Serveur */
    .server-bar { display: flex; align-items: center; justify-content: space-between; }
    .server-label { font-size: 13px; color: var(--muted); }
    .server-status-text { font-size: 13px; font-weight: 600; color: var(--muted); }
    .server-status-text.online { color: var(--green); }
    .server-status-text.offline { color: var(--red); }

    /* État fenêtre */
    .etat-center { text-align: center; }
    .etat-badge {
      display: inline-block; padding: 10px 28px; border-radius: 30px;
      font-size: 20px; font-weight: 800; background: #1e293b;
      color: var(--muted); transition: all 0.3s ease; border: 1px solid transparent;
    }
    .etat-badge.froide { color: var(--blue); border-color: rgba(59,130,246,0.4); text-shadow: 0 0 12px rgba(59,130,246,0.5); }
    .etat-badge.equilibree { color: var(--green); border-color: rgba(34,197,94,0.4); text-shadow: 0 0 12px rgba(34,197,94,0.5); }
    .etat-badge.chaude { color: var(--yellow); border-color: rgba(245,158,11,0.4); text-shadow: 0 0 12px rgba(245,158,11,0.5); }
    .etat-badge.surchauffee { color: var(--red); border-color: rgba(239,68,68,0.4); text-shadow: 0 0 12px rgba(239,68,68,0.5); }

    /* Signal IA */
    .reco-text { font-size: 16px; font-weight: 700; text-align: center; color: var(--muted); line-height: 1.5; transition: color 0.3s; }
    .reco-text.entree { color: var(--yellow); }
    .reco-text.victoire { color: var(--green); }
    .reco-text.echec { color: var(--red); }
    .reco-text.alerte { color: var(--yellow); }

    /* Boutons */
    .btn-primary {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(135deg, var(--blue), #2563eb);
      color: white; padding: 14px; border-radius: 12px;
      font-size: 15px; font-weight: 700; border: none; cursor: pointer;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }
    .btn-ghost {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #1e293b; color: var(--muted);
      padding: 10px; border-radius: 10px;
      font-size: 13px; font-weight: 600; border: 1px solid #334155; cursor: pointer;
    }
    .status-msg { font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; background: #1e293b; text-align: center; }
    .status-msg.success { color: var(--green); }
    .status-msg.error { color: var(--red); }
    .status-msg.loading { color: var(--yellow); }
    .hidden { display: none !important; }

    /* Historique */
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .history-header span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .badge { background: #334155; color: var(--muted); font-size: 11px; padding: 2px 8px; border-radius: 6px; }
    .history-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; font-family: 'Courier New', monospace; color: white; }
    .pill.bleu { background: var(--blue); }
    .pill.violet { background: var(--purple); }
    .pill.rose { background: var(--pink); }
    .pill.vert { background: var(--green); }
    .empty-state { color: #475569; font-size: 13px; font-style: italic; text-align: center; width: 100%; padding: 12px 0; }

    /* Padding bas page scroll pour ne pas être caché sous la nav */
    .page-pad-bottom { height: 8px; flex-shrink: 0; }
  </style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-left">
      <span class="logo">🎯</span>
      <span class="app-title">Tsaramaso IA</span>
    </div>
    <div id="serverDot" class="server-dot"></div>
  </header>

  <!-- PAGES -->
  <div class="pages">

    <!-- Tableau de bord -->
    <div id="page-dashboard" class="page active">

      <div class="card">
        <div class="server-bar">
          <span class="server-label">Serveur API</span>
          <span id="serverStatusText" class="server-status-text">Vérification...</span>
        </div>
      </div>

      <div class="card etat-center">
        <div class="card-title">Type de Fenêtre</div>
        <div id="etatBadge" class="etat-badge">Acquisition...</div>
      </div>

      <div class="card">
        <div class="card-title">Signal IA</div>
        <div id="recoText" class="reco-text">⚪ En attente...</div>
      </div>

      <div class="card" style="display:flex;flex-direction:column;gap:10px;align-items:center;">
        <div class="card-title" style="align-self:flex-start;">Initialisation OCR</div>
        <p style="font-size:12px;color:var(--muted);text-align:center;">
          Upload une capture de l'historique pour démarrer l'IA immédiatement
        </p>
        <input type="file" id="imageUpload" accept="image/png,image/jpeg" style="display:none">
        <button class="btn-primary" onclick="document.getElementById('imageUpload').click()">
          📸 Scanner une capture
        </button>
        <p style="font-size:11px;color:#475569;font-style:italic;text-align:center;">
          Facultatif — activation auto après 20 tours
        </p>
        <div id="statusMsg" class="status-msg hidden"></div>
      </div>

      <div class="card">
        <div class="history-header">
          <span>Radar Thermique</span>
          <span class="badge">40 max</span>
        </div>
        <div id="historyGrid" class="history-grid">
          <div class="empty-state">En attente de données...</div>
        </div>
      </div>

      <button class="btn-ghost" onclick="resetDonnees()">🗑 Réinitialiser les données</button>
      <div class="page-pad-bottom"></div>
    </div>

    <!-- Jeux -->
    <div id="page-jeux" class="page">
      <iframe id="game-iframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

  </div><!-- /pages -->

  <!-- NAV BAS -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-dashboard" onclick="naviguer('dashboard')">
      <span class="nav-icon">📊</span>
      <span>Tableau de bord</span>
    </button>
    <button class="nav-btn" id="nav-jeux" onclick="naviguer('jeux')">
      <span class="nav-icon">🎮</span>
      <span>Jeux</span>
    </button>
  </nav>

</div><!-- /app -->
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js")
      .then(() => console.log("SW actif"))
      .catch(e => console.log("SW erreur", e));
  }
</script>
</body>
</html>
